# TC-12: kata-deploy DaemonSet Only Restarts on Target Node
#
# Verifies that submitting an upgrade targeting only one node causes the
# kata-deploy pod to restart on that node while the pod on the untargeted
# node remains untouched. Confirms images and annotations reflect the
# selective upgrade.
---
- name: "TC-12: kata-deploy DaemonSet Only Restarts on Target Node"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Reset environment
      ansible.builtin.include_tasks: ../tasks/reset_environment.yaml

    - name: Record kata-deploy pod UID on worker_node_a
      ansible.builtin.shell:
        cmd: >-
          kubectl get pods -n {{ helm_namespace }} -l name=kata-deploy
          --field-selector spec.nodeName={{ worker_node_a }}
          -o jsonpath='{.items[0].metadata.uid}'
      register: _tc12_pod_a_uid_before
      changed_when: false

    - name: Record kata-deploy pod UID on worker_node_b
      ansible.builtin.shell:
        cmd: >-
          kubectl get pods -n {{ helm_namespace }} -l name=kata-deploy
          --field-selector spec.nodeName={{ worker_node_b }}
          -o jsonpath='{.items[0].metadata.uid}'
      register: _tc12_pod_b_uid_before
      changed_when: false

    - name: Record kata binary version on worker_node_a before upgrade
      ansible.builtin.include_tasks: ../tasks/assertions/kata_binary_version.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        version_fact_name: "_kata_version_before_a"
        version_label: "worker_node_a before upgrade"

    - name: Record kata binary version on worker_node_b before upgrade
      ansible.builtin.include_tasks: ../tasks/assertions/kata_binary_version.yaml
      vars:
        node_name: "{{ worker_node_b }}"
        version_fact_name: "_kata_version_before_b"
        version_label: "worker_node_b before upgrade"

    - name: Label only worker_node_a for upgrade window
      ansible.builtin.command:
        cmd: >-
          kubectl label node {{ worker_node_a }}
          katacontainers.io/kata-lifecycle-manager-window=true
          --overwrite

    - name: Build extra submit args
      ansible.builtin.set_fact:
        _tc12_extra_args: >-
          {{ '-p helm-set-values="' + kata_to_helm_set_values + '"'
             if kata_to_helm_set_values | default('') | length > 0
             else '' }}

    - name: Submit upgrade workflow
      ansible.builtin.include_tasks: ../tasks/submit_upgrade.yaml
      vars:
        target_version: "{{ kata_to_version }}"
        node_selector: "katacontainers.io/kata-lifecycle-manager-window=true"
        extra_submit_args: "{{ _tc12_extra_args }}"

    - name: Wait for workflow to finish
      ansible.builtin.include_tasks: ../tasks/wait_workflow.yaml

    - name: Assert workflow succeeded
      ansible.builtin.include_tasks: ../tasks/assertions/workflow_status.yaml
      vars:
        expected_status: "Succeeded"

    - name: Get kata-deploy pod UID on worker_node_a after upgrade
      ansible.builtin.shell:
        cmd: >-
          kubectl get pods -n {{ helm_namespace }} -l name=kata-deploy
          --field-selector spec.nodeName={{ worker_node_a }}
          -o jsonpath='{.items[0].metadata.uid}'
      register: _tc12_pod_a_uid_after
      changed_when: false

    - name: Assert kata-deploy pod on worker_node_a was recreated
      ansible.builtin.assert:
        that:
          - _tc12_pod_a_uid_after.stdout != _tc12_pod_a_uid_before.stdout
        fail_msg: >-
          Pod UID on worker_node_a is still '{{ _tc12_pod_a_uid_before.stdout }}'
          (pod was NOT recreated)
        success_msg: >-
          Pod UID on worker_node_a changed from '{{ _tc12_pod_a_uid_before.stdout }}'
          to '{{ _tc12_pod_a_uid_after.stdout }}'

    - name: Get kata-deploy pod UID on worker_node_b after upgrade
      ansible.builtin.shell:
        cmd: >-
          kubectl get pods -n {{ helm_namespace }} -l name=kata-deploy
          --field-selector spec.nodeName={{ worker_node_b }}
          -o jsonpath='{.items[0].metadata.uid}'
      register: _tc12_pod_b_uid_after
      changed_when: false

    - name: Assert kata-deploy pod on worker_node_b was not recreated
      ansible.builtin.assert:
        that:
          - _tc12_pod_b_uid_after.stdout == _tc12_pod_b_uid_before.stdout
        fail_msg: >-
          Pod UID on worker_node_b changed from '{{ _tc12_pod_b_uid_before.stdout }}'
          to '{{ _tc12_pod_b_uid_after.stdout }}' (pod was recreated unexpectedly)
        success_msg: >-
          Pod UID on worker_node_b unchanged: {{ _tc12_pod_b_uid_before.stdout }}

    - name: Assert kata-deploy image on worker_node_a contains target image
      ansible.builtin.include_tasks: ../tasks/assertions/kata_deploy_image.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        expected_image: "{{ kata_to_image.split(':')[-1] if kata_to_image | length > 0 else kata_to_version }}"

    - name: Assert kata-deploy image on worker_node_b still contains from version
      ansible.builtin.include_tasks: ../tasks/assertions/kata_deploy_image.yaml
      vars:
        node_name: "{{ worker_node_b }}"
        expected_image: "{{ kata_from_version }}"

    - name: Record kata binary version on worker_node_a after upgrade
      ansible.builtin.include_tasks: ../tasks/assertions/kata_binary_version.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        version_fact_name: "_kata_version_after_a"
        version_label: "worker_node_a after upgrade"

    - name: Record kata binary version on worker_node_b after upgrade
      ansible.builtin.include_tasks: ../tasks/assertions/kata_binary_version.yaml
      vars:
        node_name: "{{ worker_node_b }}"
        version_fact_name: "_kata_version_after_b"
        version_label: "worker_node_b after upgrade"

    - name: Assert kata binary version changed on worker_node_a
      ansible.builtin.assert:
        that:
          - _kata_version_before_a != _kata_version_after_a
        fail_msg: >-
          kata-runtime version did not change on worker_node_a:
          before='{{ _kata_version_before_a }}', after='{{ _kata_version_after_a }}'
        success_msg: >-
          kata-runtime version changed on worker_node_a:
          before='{{ _kata_version_before_a }}', after='{{ _kata_version_after_a }}'

    - name: Assert kata binary version unchanged on worker_node_b
      ansible.builtin.assert:
        that:
          - _kata_version_before_b == _kata_version_after_b
        fail_msg: >-
          kata-runtime version changed on worker_node_b (should not have):
          before='{{ _kata_version_before_b }}', after='{{ _kata_version_after_b }}'
        success_msg: >-
          kata-runtime version unchanged on worker_node_b:
          before='{{ _kata_version_before_b }}', after='{{ _kata_version_after_b }}'

    - name: Assert worker_node_a annotation status is completed
      ansible.builtin.include_tasks: ../tasks/assertions/node_annotation.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        annotation_key: "katacontainers.io/kata-lifecycle-manager-status"
        expected_value: "completed"
