# TC-18: Auto-Detect Deployment Mode
#
# Submits a workflow with deployment-mode=auto and verifies the workflow detects
# the mode the kata-deploy release is actually running in (from its Helm values)
# and completes the upgrade. Confirms the auto-detection log line reports the
# expected mode and the node is upgraded and marked completed.
---
- name: "TC-18: Auto-Detect Deployment Mode"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Reset environment
      ansible.builtin.include_tasks: ../tasks/reset_environment.yaml

    - name: Determine expected detected mode
      ansible.builtin.set_fact:
        _tc18_expected_mode: "{{ 'job' if (deployment_mode | default('daemonset')) == 'job' else 'daemonset' }}"

    - name: Record kata binary version on worker_node_a before upgrade
      ansible.builtin.include_tasks: ../tasks/assertions/kata_binary_version.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        version_fact_name: "_kata_version_before_a"
        version_label: "worker_node_a before upgrade"

    - name: Label worker_node_a for upgrade window
      ansible.builtin.command:
        cmd: >-
          kubectl label node {{ worker_node_a }}
          katacontainers.io/kata-lifecycle-manager-window=true
          --overwrite

    - name: Build extra submit args
      ansible.builtin.set_fact:
        _tc18_extra_args: >-
          {{ '-p helm-set-values="' + kata_to_helm_set_values + '"'
             if kata_to_helm_set_values | default('') | length > 0
             else '' }}

    - name: Submit upgrade workflow with deployment-mode=auto
      ansible.builtin.include_tasks: ../tasks/submit_upgrade.yaml
      vars:
        target_version: "{{ kata_to_version }}"
        node_selector: "katacontainers.io/kata-lifecycle-manager-window=true"
        submit_deployment_mode: "auto"
        extra_submit_args: "{{ _tc18_extra_args }}"

    - name: Wait for workflow to finish
      ansible.builtin.include_tasks: ../tasks/wait_workflow.yaml

    - name: Assert workflow succeeded
      ansible.builtin.include_tasks: ../tasks/assertions/workflow_status.yaml
      vars:
        expected_status: "Succeeded"

    - name: Assert logs report the auto-detected mode
      ansible.builtin.include_tasks: ../tasks/assertions/workflow_log_contains.yaml
      vars:
        expected_substring: "Auto-detected deployment mode: {{ _tc18_expected_mode }}"

    - name: Record kata binary version on worker_node_a after upgrade
      ansible.builtin.include_tasks: ../tasks/assertions/kata_binary_version.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        version_fact_name: "_kata_version_after_a"
        version_label: "worker_node_a after upgrade"

    - name: Assert kata binary version changed on worker_node_a
      ansible.builtin.assert:
        that:
          - _kata_version_before_a != _kata_version_after_a
        fail_msg: >-
          kata-runtime version did not change on worker_node_a:
          before='{{ _kata_version_before_a }}', after='{{ _kata_version_after_a }}'
        success_msg: >-
          kata-runtime version changed on worker_node_a:
          before='{{ _kata_version_before_a }}', after='{{ _kata_version_after_a }}'

    - name: Assert worker_node_a annotation status is completed
      ansible.builtin.include_tasks: ../tasks/assertions/node_annotation.yaml
      vars:
        node_name: "{{ worker_node_a }}"
        annotation_key: "katacontainers.io/kata-lifecycle-manager-status"
        expected_value: "completed"

    - name: Assert worker_node_a is schedulable
      ansible.builtin.include_tasks: ../tasks/assertions/node_schedulable.yaml
      vars:
        node_name: "{{ worker_node_a }}"
