#
# Verification pod that fails when the current node matches ${FAIL_NODE}.
# TC-14 substitutes ${FAIL_NODE} with the actual node name before encoding.
# ${NODE} and ${TEST_POD} are substituted at runtime by the lifecycle manager.
apiVersion: v1
kind: Pod
metadata:
  name: ${TEST_POD}
spec:
  runtimeClassName: kata-qemu
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: ${NODE}
  tolerations:
    - operator: Exists
  containers:
    - name: verify
      image: quay.io/kata-containers/alpine-bash-curl:latest
      command:
        - sh
        - -c
        - |
          echo "Running verification on node: ${NODE}"
          if [ "${NODE}" = "${FAIL_NODE}" ]; then
            echo "VERIFICATION FAILED: node designated for failure"
            exit 1
          fi
          echo "SUCCESS: verification passed"
