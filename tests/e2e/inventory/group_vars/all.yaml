# E2E test configuration. Override any variable via --extra-vars.

# -- Cluster (kcli) --
cluster_name: kata-lifecycle-test
cluster_ctlplanes: 1
cluster_workers: 2
cluster_image: ubuntu2604
cluster_memory: 32768
cluster_cpus: 8
cluster_disk: 100

# -- Deployment mode --
# kata-deploy deployment model under test: daemonset | job
#   daemonset - long-running DaemonSet (chart default; min version 3.27.0)
#   job       - dispatcher-driven per-node install Jobs (min version 3.32.0)
#
# Job mode needs a chart that exposes deploymentMode, which released charts do
# from 3.32.0 on; older ones fail fast at the install preflight. The daemonset
# default exercises mode-detection, the migration guard, and batching.
deployment_mode: "daemonset"

# Number of nodes upgraded per wave (1 = strict node-by-node).
batch_size: 1

# First kata-deploy chart version that ships job mode. Used by tests that
# exercise the daemonset<->job migration guard (kept in sync with the
# workflow's hardcoded MIN_JOB_VERSION).
min_job_version: "3.32.0"

# -- Kata Versions --
# FROM = initial install version; TO = upgrade target.
# Minimum supported: 3.27.0 (daemonset) / 3.32.0 (job).
# 0.0.0-dev is the chart kata-containers publishes from main.
#
# run_tests.sh resolves 'previous' and 'latest' against the chart registry and
# passes concrete versions in, so these only apply when a playbook is run
# through ansible-playbook directly. Keep them at released versions.
kata_from_version: "3.30.0"
kata_to_version: "4.0.0"

# Image overrides for CI builds.
# Empty string = the image the chart of that version defaults to, which is what
# a version should normally run: a kata-deploy image expects the mounts and
# security context rendered by the chart it shipped with, so pairing it with
# another version's chart crash-loops the pod. The rolling
# kata-deploy-ci:kata-containers-latest image belongs to the 0.0.0-dev chart;
# run_tests.sh refuses any other combination.
kata_from_image: ""
kata_to_image: ""

# job mode: override for the kata-deploy-job-dispatcher image (empty = chart default).
# When testing a CI kata-deploy image, point this at the matching dispatcher image.
kata_job_dispatcher_image: ""

# -- Runtime class (set per iteration by run_tests.sh) --
kata_runtime_class: "kata-qemu"

# -- Argo Workflows --
argo_version: "v3.6.4"
argo_namespace: "argo"

# -- Helm --
helm_release: "kata-deploy"
helm_namespace: "kube-system"

# kata-deploy chart source for the INITIAL install in the e2e harness.
#   - An OCI/HTTP ref (default) is pulled at kata_from_version.
#   - A local path (e.g. a kata-containers checkout) is used as-is, ignoring
#     kata_from_version, so you can test job mode before it ships in a release:
#       kata_deploy_chart: "/path/to/kata-containers/tools/packaging/kata-deploy/helm-chart/kata-deploy"
# Job mode requires a chart that exposes the `deploymentMode` value; the install
# role probes for it and fails fast with guidance if it is missing.
kata_deploy_chart: "oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy"

# -- Lifecycle manager chart --
# Path to local chart (relative to repository root).
lifecycle_manager_chart_path: "."

# -- Timeouts (seconds unless noted) --
cluster_create_timeout: 1200
kata_deploy_ready_timeout: 300
workflow_timeout: 900
verification_timeout: 180

# -- Log Rotation --
results_base_dir: "/var/lib/kata-e2e/results"
results_max_runs: 10
results_max_age_days: 30
results_max_total_mb: 2048

# -- Local Registry (ephemeral per-run image cache) --
registry_port: 5000
registry_container_name: kata-e2e-registry
kata_deploy_default_repo: "quay.io/kata-containers/kata-deploy"

# -- Derived (populated at runtime by setup/reset tasks) --
registry_host: ""
worker_node_a: ""
worker_node_b: ""
control_plane_node: ""
kata_to_helm_set_values: ""
kata_from_helm_set_values: ""
skip_cluster_create: false
skip_cluster_delete: false
