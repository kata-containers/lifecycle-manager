# Argo Workflows namespace where the WorkflowTemplate will be created
argoNamespace: argo

# Default workflow parameters (can be overridden when submitting workflows)
defaults:
  # Helm release name for kata-deploy
  helmRelease: kata-deploy

  # Namespace where kata-deploy is installed
  helmNamespace: kube-system

  # kata-deploy deployment model the release uses:
  #   auto      - (default) detect from the existing release values
  #               (helm get values .deploymentMode), falling back to daemonset.
  #   daemonset - long-running privileged DaemonSet; upgrades roll one pod per
  #               node via updateStrategy.type=OnDelete (kata-deploy >= 3.27.0).
  #   job       - no resident component; a dispatcher Job fans out short-lived,
  #               per-node install Jobs. The workflow drives the dispatcher one
  #               wave (batch) at a time so it can verify and roll back per node.
  deploymentMode: auto

  # Number of nodes upgraded per wave (batch).
  #   1            - strict node-by-node (verify each node before the next).
  #   N (> 1)      - upgrade up to N nodes per wave, then verify the whole wave;
  #                  if any node fails verification the wave's failed node(s) are
  #                  rolled back and the workflow stops (fail-fast between waves).
  # On large fleets (hundreds/thousands of nodes) raise this substantially -
  # upgrading strictly one node at a time does not scale.
  #
  # In job mode this also sets the kata-deploy dispatcher's job.parallelism, so
  # the whole wave's per-node install Jobs run concurrently (the wave is cordoned
  # together and verified together anyway). To pace installs, lower batchSize.
  batchSize: 1

  # Label selector for nodes to upgrade (optional if using taint selection)
  nodeSelector: ""

  # Taint-based node selection (optional, alternative to label selector)
  # Select nodes that have a taint with this key
  nodeTaintKey: ""
  # Optional: filter by taint value (only used if nodeTaintKey is set)
  nodeTaintValue: ""

  # Namespace for verification pods
  verificationNamespace: default

  # Verification pod spec (REQUIRED)
  #
  # A verification pod is required to validate each node after upgrade.
  # The chart will fail to install without one.
  #
  # Provide via:
  #   helm install kata-lifecycle-manager oci://ghcr.io/kata-containers/kata-lifecycle-manager-charts/kata-lifecycle-manager ... \
  #     --set-file defaults.verificationPod=/path/to/your-verification-pod.yaml
  #
  # Or override at workflow submission (base64-encoded):
  #   argo submit ... -p verification-pod="$(base64 -w0 < pod.yaml)"
  #
  # Note: kata-deploy's own verification is disabled during upgrade because
  # it is cluster-wide (designed for initial install), while kata-lifecycle-manager
  # performs per-node verification with proper placeholder substitution.
  #
  # Placeholders substituted at runtime:
  #   ${NODE} - the node being upgraded/verified
  #   ${TEST_POD} - generated unique pod name
  #
  verificationPod: ""

  # Optional: Drain nodes before upgrade (default: false)
  # Not required for Kata upgrades since running VMs use in-memory binaries.
  # Enable if you prefer to evict workloads before upgrading.
  drainEnabled: false

  # Timeout for node drain (only used if drainEnabled is true)
  drainTimeout: "300s"

  # Extra --set values passed to helm upgrade for the kata-deploy chart.
  # Comma-separated key=value pairs using Helm --set syntax.
  # Use this to override the kata-deploy container image or any chart value.
  #
  # Example: deploy from a custom registry:
  #   --set defaults.helmSetValues="image.reference=myregistry.io/kata-deploy\,image.tag=my-custom-tag"
  #
  # Or override at workflow submission:
  #   argo submit ... -p helm-set-values="image.reference=myregistry.io/kata-deploy,image.tag=my-custom-tag"
  helmSetValues: ""

# Container image used by all workflow steps (Helm 4 + kubectl)
# The repo builds it weekly (see .github/workflows/build-images.yaml) and pushes to GHCR.
# Override to use your own registry or a pinned digest.
images:
  # Use the image built weekly by this repo, or override with your own
  utils: ghcr.io/kata-containers/lifecycle-manager-utils:latest

# To use the image built weekly by this repo:
#   --set images.utils=ghcr.io/kata-containers/lifecycle-manager-utils:latest
